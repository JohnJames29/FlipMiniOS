name: Internal Android Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/emulator-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK for device smoke test
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Android 15 emulator and exercise UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/smoke_emulator.sh
      - name: Save emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlipMiniOS-emulator-smoke-results
          path: smoke-results/
          if-no-files-found: ignore
          retention-days: 7
