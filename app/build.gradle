plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flipminios.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flipminios.launcher'
        minSdk 30
        targetSdk 35
        versionCode 8
        versionName '0.7.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

// Rotation overlay uses only Android platform APIs, without Shizuku.
