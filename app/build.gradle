plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flipminios.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flipminios.launcher'
        minSdk 30
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

// Optional Shizuku 13.5 bridge. The app remains fully usable without Shizuku.
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
