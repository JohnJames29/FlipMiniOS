name: Build Flip Mini OS APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK Platform 35 and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate source structure
        run: python3 tests/check_project.py
      - name: Validate Lite build and Java syntax
        run: |
          python3 tests/verify_release.py
          mkdir -p /tmp/flip-syntax
          javac -d /tmp/flip-syntax tools/ParseJava.java
          java -cp /tmp/flip-syntax ParseJava app/src/main/java
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify embedded cover rotation components
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > /tmp/flip-manifest.txt
          grep -Fq 'CoverRotationEngineActivity' /tmp/flip-manifest.txt
          grep -Fq 'CoverRotationAccessibilityService' /tmp/flip-manifest.txt
          grep -Fq 'android.permission.SYSTEM_ALERT_WINDOW' /tmp/flip-manifest.txt
          ! grep -Fq 'rikka.shizuku.ShizukuProvider' /tmp/flip-manifest.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Fq 'assets/third_party/CoverSpin-LICENSE.txt'
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipMiniOS-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
